[package]
name = "harbour"
version = "0.1.0"
edition = "2024"
description = "Curated torrents straight from your terminal"
license = "MIT"

[lib]
name = "harbour"
path = "src/lib.rs"

[[bin]]
name = "harbour"
path = "src/main.rs"

[dependencies]
# Async runtime for the event loop and background tasks
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
# Terminal UI framework for rendering differential frames
ratatui = "0.29"
# Terminal manipulation (raw mode, alt-screen, events)
crossterm = "0.28"
# Command-line argument parsing with derive support
clap = { version = "4", features = ["derive"] }
# Data serialization and deserialization
serde = { version = "1.0", features = ["derive"] }
# JSON parser for theme schemas
serde_json = "1.0"
# Error handling with context
anyhow = "1.0"
