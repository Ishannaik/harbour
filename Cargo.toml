[package]
name = "harbour"
version = "0.1.0"
edition = "2024"
description = "Curated torrents straight from your terminal"
license = "MIT"

[dependencies]
crossterm = "0.29.0"
dirs = "6.0.0"
notify = "8.2.0"
quick-xml = "0.41.0"
ratatui = "0.30.2"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }
toml = "1.1.4"
