[package]
name = "harbour"
version = "0.1.0"
edition = "2024"
description = "Curated torrents straight from your terminal"
license = "MIT"

[dependencies]
crossterm = "0.29.0"
dirs = "6.0.0"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
librqbit = { version = "8.1.1", features = ["http-api", "tracing-subscriber-utils"] }
notify = "8.2.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["default-tls", "gzip", "brotli", "stream"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }
toml = "1.1.4"
