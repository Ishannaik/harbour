# FR-64: dependency license policy. OSI-permissive only — harbour is MIT and
# copyleft dependencies would leak the license. Extend ONLY with
# OSI-permissive licenses (see plan Step 6).
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    # MPL-2.0: weak/file-level copyleft (not project-infecting). Required by
    # the pre-existing scraper → cssparser chain (Servo lineage, the CSS
    # selector engine); refusing it would make the deny gate permanently red
    # on a core dependency. Standard in Rust ecosystems (Firefox/Servo).
    "MPL-2.0",
    # CDLA-Permissive-2.0: OSI-approved permissive license (data-focused).
    "CDLA-Permissive-2.0",
]
