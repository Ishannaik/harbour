# FR-64: the enforcement backbone. fmt → clippy → tests → line length →
# dependency audits, cached and fail-fast, on every push and PR. Network-
# gated tests (tests/engine_net.rs, tests/search_net.rs) self-skip without
# HARBOUR_TEST_NET=1, so this job never depends on live swarms or sites.
name: ci
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  # rustsec/audit-check posts a check run with its findings.
  checks: write
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      # The maintained toolchain action (dtolnay/rust-toolchain is deprecated
      # since 2025); it wires rust-cache caching in itself.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: lint
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: line length ≤ 100
        run: |
          bad="$(awk 'length($0) > 100 {print FILENAME":"FNR": "length($0)}' $(git ls-files '*.rs'))"
          [ -z "$bad" ] || { echo "$bad"; exit 1; }
      - name: audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2026-0194/0195: quick-xml <0.41 DoS advisories (quadratic
          # duplicate-attr scan, unbounded namespace allocation). The direct
          # dep migrated to oxixml-xml; the vulnerable copy is transitive via
          # librqbit-upnp (hard-pinned to quick-xml 0.37.5, no upstream fix —
          # librqbit 9 is the only update path and is a release candidate).
          # Surface: UPnP responses from trusted local-network devices only;
          # DoS, no data exposure. Revisit when librqbit ships stable 9.x.
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195
      - name: deny
        uses: EmbarkStudios/cargo-deny-action@v2
