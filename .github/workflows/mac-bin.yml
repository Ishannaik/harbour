# Ready-made Mac binary for friends. Trigger: gh workflow run mac-bin.yml
name: mac-bin
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: release binary
        run: |
          cargo build --release
          mkdir -p dist
          cp target/release/harbour dist/harbour
          chmod +x dist/harbour
          file dist/harbour
      - uses: actions/upload-artifact@v4
        with:
          name: harbour-macos
          path: dist/harbour
